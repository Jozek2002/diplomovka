; PlatformIO Project Configuration File
; Diplomová práca: Komparatívna analýza aplikačných protokolov pre riadenie a telemetriu vo Wi-Fi IoT sieťach
; Doska: ESP32-WROOM-32 (30-pin)

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Rýchlosť sériového monitora
monitor_speed = 115200

; Rýchlosť nahrávania firmvéru cez USB
upload_speed = 921600

; Knižničné závislosti
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    tzapu/WiFiManager @ ^2.0.17

; Filtre pre sériový monitor
monitor_filters =
    esp32_exception_decoder
    time
    default
